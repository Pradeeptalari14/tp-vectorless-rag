version: '3.8'

services:
  tp-vectorless-rag-db:
    image: postgres:16-alpine
    container_name: tp-vectorless-rag-db-1
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SparseSearch2026!
      - POSTGRES_DB=vectorless_rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectorless_rag"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
